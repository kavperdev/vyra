name: Android app

# Builds the VYRA Android app (Capacitor shell around vyraathl.pl) and publishes the signed APK
# to public/download/vyra.apk, so the website serves it at https://vyraathl.pl/download/vyra.apk.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - id: checkout
        uses: actions/checkout@v5
      - id: node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        id: install
        run: bash ci-step.sh install "npm install --no-audit --no-fund"

      - name: Create the Android project
        id: project
        run: |
          bash ci-step.sh "cap add" "npx cap add android"
          bash ci-step.sh assets "npx capacitor-assets generate --android --iconBackgroundColor '#050506' --iconBackgroundColorDark '#050506' --splashBackgroundColor '#050506' --splashBackgroundColorDark '#050506'"
          bash ci-step.sh "cap sync" "npx cap sync android"

      - name: Version
        id: v
        run: |
          CODE=$(( $(date +%s) / 60 - 29300000 ))
          NAME="1.0.${{ github.run_number }}"
          sed -i "s/versionCode [0-9]*/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$NAME\"/" android/app/build.gradle
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        run: bash ci-step.sh gradle "cd android && ./gradlew assembleRelease --no-daemon"

      - name: Sign
        id: sign
        # The keystore in mobile/keystore is encrypted; its password lives only in the repo secret.
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Add the ANDROID_KEYSTORE_PASSWORD secret (GitHub → Settings → Secrets → Actions)."; exit 1; }
          cp keystore/vyra-release.jks release.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias vyra --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out vyra.apk aligned.apk
          "$BT/apksigner" verify vyra.apk
          rm release.jks

      - name: Publish to the website
        id: publish
        working-directory: .
        run: |
          mkdir -p public/download
          cp mobile/vyra.apk public/download/vyra.apk
          SIZE=$(stat -c %s public/download/vyra.apk)
          printf '{\n  "version": "%s",\n  "bytes": %s,\n  "built": "%s"\n}\n' "${{ steps.v.outputs.name }}" "$SIZE" "$(date -u +%Y-%m-%d)" > src/lib/android-release.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/download/vyra.apk src/lib/android-release.json
          git commit -m "Android app ${{ steps.v.outputs.name }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report
        if: failure()
        working-directory: .
        run: echo "::error title=Step outcomes::${{ join(steps.*.outcome, ' ') }} · ANDROID_HOME=$ANDROID_HOME"
