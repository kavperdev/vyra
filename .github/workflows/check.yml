name: check
on: { push: { branches: [ci-check] } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit 2>&1 | grep -v "^supabase" | head -60 || true
      - run: npx eslint src 2>&1 | grep -B2 -A2 "error" | head -60 || true
