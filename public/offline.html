<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>VYRA · Brak połączenia</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: grid; place-content: center; gap: 18px; padding: 24px; text-align: center; }
  img { height: 18px; margin: 0 auto 12px; }
  p.eyebrow { margin: 0; font: 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .35em; text-transform: uppercase; color: #f03339; }
  h1 { margin: 0; font-size: 24px; font-weight: 600; }
  p { margin: 0; color: rgba(255,255,255,.6); max-width: 22rem; line-height: 1.5; font-size: 15px; }
  button { margin: 8px auto 0; height: 44px; padding: 0 22px; border-radius: 999px; border: 0; background: #fff; color: #000; font-weight: 600; font-size: 14px; }
</style>
</head>
<body>
<main>
  <img src="/branding/vyra-logo-white.svg" alt="VYRA">
  <p class="eyebrow">Brak połączenia</p>
  <h1>Jesteś offline</h1>
  <p>Połącz się z internetem, a VYRA wczyta Twój plan i wyniki. Zapisane treningi są bezpieczne.</p>
  <button onclick="location.reload()">Spróbuj ponownie</button>
</main>
</body>
</html>
